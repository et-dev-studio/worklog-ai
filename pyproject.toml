[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worklog-ai"
version = "2.0.0.dev0"
description = "Collaborative engineering memory operating system."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "et-dev-studio" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "questionary>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
wl = "cli.main:app"
worklog = "cli.main:app"

[tool.setuptools.packages.find]
include = ["agents*", "cli*", "db*", "services*", "integrations*"]

[tool.setuptools.package-data]
"*" = ["prompts/*.txt", "config/*.toml", "alembic/*.ini", "alembic/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
