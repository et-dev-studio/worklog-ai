[alembic]
script_location = alembic
# URL is supplied by alembic/env.py from WORKLOG_DB_SERVICE_ROLE_KEY
# (or WORKLOG_DB_URL fallback). Do not hardcode a URL here — v2 is
# Postgres-only and per-developer/Supabase project.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
